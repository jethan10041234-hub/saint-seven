<!doctype html><html lang="ko"><meta charset="utf-8"><title>SAINT SEVEN · 배포본 검증</title><style>body{background:#11170d;color:#f4eedc;font:15px monospace;margin:12px}button{font:inherit;background:#c9aa60;color:#18200e;padding:10px}iframe{width:1280px;height:720px;border:0}pre{white-space:pre-wrap}</style><button id="run">배포본 검증 실행</button><pre id="result">배포본 준비 중</pre><iframe id="game" src="../../SAINT_SEVEN_v06_play.html?__test=1" title="단일 HTML 배포본"></iframe><script>
const f=document.querySelector('#game'),out=document.querySelector('#result'),wait=ms=>new Promise(r=>setTimeout(r,ms));let errors=[];
function assert(v,m){if(!v)throw Error(m)}
async function until(fn,m){for(let i=0;i<600;i++){if(fn())return;await wait(50)}throw Error(m)}
f.onload=()=>out.textContent='준비됨';document.querySelector('#run').onclick=async()=>{try{const w=f.contentWindow,d=w.document,t=w.SAINT_TEST;await until(()=>t?.snapshot().ready,'game ready');assert(w.SAINT_EMBEDDED,'embedded files');const paths=w.SAINT_AUDIO.assetPaths;assert(paths.length===25&&paths.every(p=>w.SAINT_EMBEDDED[p].startsWith('data:audio/')),'25 embedded WAV');assert(['normal','bad','true'].every(k=>w.SAINT_EMBEDDED['assets/endings/'+k+'.png'].startsWith('data:image/png')),'3 embedded artworks');w.addEventListener('error',e=>errors.push(e.message));d.querySelector('#startButton').click();await until(()=>t.snapshot().audio.state==='running'&&t.snapshot().audio.hasSignal,'audio start');assert(t.snapshot().audio.origins.bgm_church==='embedded','embedded music origin');d.querySelector('#bgmButton').click();assert(!t.snapshot().audio.enabled,'master off');d.querySelector('#bgmButton').click();assert(t.snapshot().audio.enabled,'master on');t.reset();for(const id of ['normal','bad','true']){const config=w.SAINT_NARRATIVE.endingFor(id,t.snapshot().game);w.SAINT_ENDINGS.show(id,{...config,image:w.SAINT_EMBEDDED['assets/endings/'+id+'.png'],onTitle:()=>t.reset()});await until(()=>w.SAINT_ENDINGS.snapshot().imageReady,'image '+id);const im=d.querySelector('#endingIllustration');assert(im.naturalWidth===1536&&im.naturalHeight===1024,'full image dimensions');assert(im.src.startsWith('data:'),'image embed');assert(d.querySelector('#endingText').textContent===config.captions[0],'caption preserved');w.SAINT_ENDINGS.reset();}assert(d.body.scrollWidth<=w.innerWidth&&d.body.scrollHeight<=w.innerHeight,'no scroll');const resourceURLs=w.performance.getEntriesByType('resource').map(r=>r.name).filter(x=>/^https?:/.test(x));assert(resourceURLs.length===0,'unexpected asset requests '+resourceURLs.join(','));assert(errors.length===0,'browser errors '+errors);t.reset();out.textContent='ALL PASS · 단일 HTML / 56개 내장 에셋 / 음악·음소거 / 엔딩 그림 3장 / 외부 요청 없음 / 오류 없음';document.documentElement.dataset.result='passed';}catch(e){out.textContent='FAIL · '+e.stack;document.documentElement.dataset.result='failed';}};
</script></html>
