<!doctype html><meta charset="utf-8"><title>SAINT SEVEN 통합 검증</title>
<style>body{background:#161b10;color:#f4eedc;font:14px monospace;margin:20px}button{padding:12px 25px;background:#c9aa60;border:0}iframe{width:100%;height:820px;border:1px solid #c9aa60}pre{white-space:pre-wrap;line-height:1.7;max-height:180px;overflow:auto}</style>
<button id="run">통합 검증 실행</button><pre id="result">준비 중</pre><iframe id="game" src="../index.html?__test=1"></iframe>
<script>
const frame=document.querySelector('iframe'),out=document.querySelector('pre');
const wait=ms=>new Promise(r=>setTimeout(r,ms));const log=s=>out.textContent+=s+'\n';
async function until(fn){for(let i=0;i<800;i++){if(fn())return;await wait(25);}throw Error('wait timeout');}
function assert(v,message){if(!v)throw Error(message);}
let w,d,api;
function key(code,type='keydown'){d.querySelector('canvas').dispatchEvent(new w.KeyboardEvent(type,{code,bubbles:true}));}
function closeInfo(){const e=d.querySelector('#infoModal');if(e.open)d.querySelector('#infoActions button').click();}
function advanceAll(){for(let i=0;i<80;i++){const x=api.snapshot();if(!x.dialogue||x.busy)break;if(x.dialogue.index===x.dialogue.total-1&&x.dialogue.choices.length)break;api.advance();}}
async function intro(choice){api.reset();api.start();const cast=api.snapshot().cast.join(',');assert(new Set(api.snapshot().cast).size===6,'unique village cast');assert(new Set(api.snapshot().actors.filter(a=>a.id.startsWith('crowd')).map(a=>a.character)).size===6,'unique church crowd');advanceAll();await until(()=>api.snapshot().dialogue?.total===4&&!api.snapshot().busy);advanceAll();closeInfo();assert(api.snapshot().game.phase==='seven','opening state');api.go('entrance',{x:501,y:290});api.interact();assert(api.snapshot().dialogue.total===11,'seven encounter');advanceAll();await until(()=>api.snapshot().game.phase==='gossip'&&!api.snapshot().busy);advanceAll();closeInfo();api.go('square',{x:455,y:365});assert(api.snapshot().cast.join(',')===cast,'stable cast across maps');assert(new Set(api.snapshot().actors.filter(a=>a.id!=='elder').map(a=>a.character)).size===3,'unique square crowd');api.interact();for(let i=0;i<6;i++){assert(d.querySelector('#fullSVG').getAttribute('viewBox')===w.SAINT_DATA.characters[api.snapshot().cast[i%3]].crop.join(' '),'gossip image follows speaker');api.advance();}assert(api.snapshot().game.phase==='elder','gossip state');api.go('square',{x:925,y:720});api.interact();advanceAll();api.choose(choice);advanceAll();closeInfo();assert(api.snapshot().game.phase==='investigation','investigation state');assert(api.snapshot().game.trust===0&&api.snapshot().game.suspicion===0,'meters start zero');}
function clue(id){api.collect(id);closeInfo();}
function faith(){api.talk('eli');api.choose(0);advanceAll();api.choose(0);}
async function ending(expected){api.requestRitual();assert(d.querySelector('#infoTitle').textContent.includes('진행'),'ritual confirm');closeInfo();advanceAll();if(expected==='true'){closeInfo();advanceAll();}assert(api.snapshot().cinematic?.kind===expected,'correct ritual cutscene');assert(api.snapshot().cinematic.victim===(expected==='bad'?'hormasset':'seven'),'correct sacrifice');key('KeyE');assert(!!api.snapshot().cinematic,'E does not skip ritual');await until(()=>api.snapshot().cinematic?.time>5);assert(api.snapshot().cinematic.struck===(expected!=='true'),'strike only in sacrifice endings');assert(d.querySelector('#endingScreen').hidden,'scene precedes ending');await until(()=>api.snapshot().game.phase==='ending'&&!api.snapshot().busy);assert(api.snapshot().game.ending===expected,'ending '+expected);assert(!d.querySelector('#endingScreen').hidden,'ending visible');}
function navigation(){const D=w.SAINT_DATA,visited=new Set();const seeds={church:{x:625,y:906}};for(const m of Object.values(D.maps))for(const e of m.interactions.filter(t=>t.type==='exit')){assert(api.go(e.target,e.spawn),'spawn '+e.id);seeds[e.target]=e.spawn;}
for(const [id,seed] of Object.entries(seeds)){api.go(id,seed);const step=12,q=[[seed.x,seed.y]],seen=new Set(),reachable=new Set();for(let i=0;i<q.length;i++){const [x,y]=q[i],k=x+','+y;if(seen.has(k))continue;seen.add(k);if(!api.canWalk(x,y))continue;for(const t of D.maps[id].interactions){if(Math.hypot(t.x-x,t.y-y)<=t.radius-16)reachable.add(t.id);}for(const [dx,dy] of [[step,0],[-step,0],[0,step],[0,-step]]){const nx=x+dx,ny=y+dy;if(nx>0&&ny>0&&nx<1254&&ny<1254&&!seen.has(nx+','+ny))q.push([nx,ny]);}}for(const t of D.maps[id].interactions)assert(reachable.has(t.id),'unreachable '+id+':'+t.id);log('PASS · '+id+' 출입구/단서 접근 '+reachable.size);}}
document.querySelector('#run').onclick=async()=>{document.querySelector('#run').disabled=true;out.textContent='';try{w=frame.contentWindow;d=w.document;api=w.SAINT_TEST;await until(()=>api?.snapshot().ready);navigation();await intro(0);log('PASS · 네 분기 → 조사 시작');api.collect('restore');assert(!api.snapshot().game.found.includes('restored'),'restoration gated');advanceAll();clue('parchment');clue('diary');clue('restore');clue('bible');clue('bible');assert(api.snapshot().game.suspicion===3,'true threshold');clue('bible');assert(api.snapshot().game.suspicion===3,'repeat clue');await ending('true');log('PASS · 트루 엔딩 / 중복 획득 방지');
await intro(1);log('PASS · 침묵 분기 → 조사 시작');clue('parchment');clue('bible');faith();faith();assert(api.snapshot().game.trust===3,'normal threshold');await ending('normal');log('PASS · 노멀 엔딩');
await intro(0);clue('parchment');clue('bible');faith();faith();api.talk('elder');advanceAll();assert(api.snapshot().game.trust===4,'bad threshold');api.talk('elder');advanceAll();assert(api.snapshot().game.trust===4,'repeat elder');await ending('bad');log('PASS · 배드 엔딩 / 주민 재대화 중복 방지');
api.reset();api.start();const before=api.snapshot().dialogue.index;key('Escape');assert(d.querySelector('#pauseModal').open,'pause');key('Escape');assert(api.snapshot().dialogue.index===before,'pause preserves story');log('PASS · Esc로 이야기 건너뛰기 방지');
log('안내 · 실제 WASD 이동은 일반 게임 화면에서 별도 확인합니다.');
log('PASS · 주민 외형 중복 방지/맵 이동 유지/대화 연동, 세 컷신 자동 완료');log('ALL PASS');}catch(e){log('FAIL · '+e.stack);}finally{document.querySelector('#run').disabled=false;}};
frame.onload=()=>out.textContent='게임을 불러왔습니다. 통합 검증을 실행할 수 있습니다.';
</script>
