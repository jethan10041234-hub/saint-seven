<script>
'use strict';
const frame=document.querySelector('#game'),out=document.querySelector('#result'),summary=document.querySelector('#summary'),metrics=document.querySelector('#metrics'),preview=document.querySelector('#preview');
const sizes=[[1920,1080],[1440,900],[1366,768],[1280,720],[390,844],[844,390],[800,600]],wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
let w,d,api,currentSize=[1280,720],running=false,rows=[],errors=[],layoutErrors=[],initialAudio=null;
const assert=(v,message)=>{if(!v)throw Error(message);};
function log(message){out.textContent+=message+'\n';out.scrollTop=out.scrollHeight;}
async function until(fn,message='기다리기 시간 초과',timeout=22000){const start=performance.now();while(performance.now()-start<timeout){if(fn())return;await wait(40);}throw Error(message);}
function scalePreview(){const scale=Math.min(1,preview.clientWidth/currentSize[0]);frame.style.transform='scale('+scale+')';preview.style.height=Math.ceil(currentSize[1]*scale)+'px';document.querySelector('#inspection').textContent='게임 내부의 실제 viewport: '+currentSize.join(' × ')+' CSS px / 검토 화면 배율 '+Math.round(scale*100)+'%';}
async function resize(size){
  currentSize=[...size];frame.style.width=size[0]+'px';frame.style.height=size[1]+'px';scalePreview();
  await until(()=>w.innerWidth===size[0]&&w.innerHeight===size[1],'iframe 크기 적용 실패',5000);
  w.SAINT_LAYOUT?.refresh();
  // A resized iframe can report its new viewport before the game's scheduled
  // layout frame runs. Wait for its CSS viewport and two stable rendered frames;
  // do not wait for overflow to disappear, which would conceal a layout defect.
  await new Promise((resolve,reject)=>{
    let request=0,previous='',stable=0,latest=null,finished=false;
    const finish=error=>{if(finished)return;finished=true;clearTimeout(timeout);w.cancelAnimationFrame(request);error?reject(error):resolve();};
    const timeout=setTimeout(()=>finish(Error('레이아웃 적용/안정화 시간 초과: '+JSON.stringify({expected:size,actual:latest}))),12000);
    const sample=()=>{
      if(finished)return;
      try{
        const css=w.getComputedStyle(d.documentElement),body=d.body.getBoundingClientRect();
        latest={viewport:[w.innerWidth,w.innerHeight],css:[parseFloat(css.getPropertyValue('--app-width')),parseFloat(css.getPropertyValue('--app-height'))],body:[body.width,body.height]};
        const applied=latest.viewport.every((v,i)=>v===size[i])&&latest.css.every((v,i)=>Math.abs(v-size[i])<1)&&latest.body.every((v,i)=>Math.abs(v-size[i])<1);
        const geometry=[...d.querySelectorAll('.page,.layout,.game-panel,#stage,#dialogue,#fullFigure,#endingIllustration,#endingText,#endingQuestions,dialog[open]')].filter(rendered).map(el=>{const r=el.getBoundingClientRect();return [r.x,r.y,r.width,r.height,el.scrollWidth,el.scrollHeight].map(v=>Math.round(v*100)/100);});
        const signature=JSON.stringify(geometry);
        stable=applied&&signature===previous?stable+1:0;previous=signature;
        if(applied&&stable>=2)return finish();
        request=w.requestAnimationFrame(sample);
      }catch(error){finish(error);}
    };
    request=w.requestAnimationFrame(sample);
  });
}
function bind(){w=frame.contentWindow;d=w.document;api=w.SAINT_TEST;}
function rendered(el){if(!el||!el.getClientRects().length)return false;for(let n=el;n&&n.nodeType===1;n=n.parentElement){const s=w.getComputedStyle(n);if(n.hidden||s.display==='none'||s.visibility==='hidden')return false;}return true;}
function inside(el,label){if(!rendered(el))return;const r=el.getBoundingClientRect(),tol=2;assert(r.left>=-tol&&r.top>=-tol&&r.right<=w.innerWidth+tol&&r.bottom<=w.innerHeight+tol,label+' 화면 이탈: '+JSON.stringify({x:r.x,y:r.y,width:r.width,height:r.height}));}
function textFits(el,label){if(!rendered(el))return;inside(el,label);assert(el.scrollWidth<=el.clientWidth+2,label+' 가로 글자 잘림: '+el.scrollWidth+' / '+el.clientWidth);assert(el.scrollHeight<=el.clientHeight+2,label+' 세로 글자 잘림: '+el.scrollHeight+' / '+el.clientHeight);}
function inspectLayout(label){
  const root=d.documentElement,body=d.body;
  const x=Math.max(root.scrollWidth,body.scrollWidth)-w.innerWidth,y=Math.max(root.scrollHeight,body.scrollHeight)-w.innerHeight;
  assert(x<=2&&y<=2,label+' 페이지 스크롤: '+x+' × '+y);
  for(const selector of ['.page','.masthead','.layout','.sidebar','.game-panel','#stage','#gameCanvas','#dialogue','#portraitWrap','#fullFigure','#titleScreen','#endingScreen','#cinematicCaption','#endingIllustration','#endingQuestions','.controls','dialog[open]'])for(const el of d.querySelectorAll(selector))inside(el,label+' '+selector);
  for(const selector of ['#dialogueText','#speaker','#objective','#locationName','#meterNote','#clueCount','.meter h2','.meter>span','.dialogue-actions button','.scene-bar>span','.sidebar>.button','.controls','#titleScreen>p','#titleScreen>h2','#titleScreen>button','#endingScreen>p','#endingScreen>h2','#endingScreen>button','#cinematicHeading','#cinematicLine','dialog[open] p','dialog[open] h2','dialog[open] h3','dialog[open] button','.layout-page-navigation','#endingText','#endingQuestions p','#endingNext','#endingPrevious','#endingShowAll','#endingSkipReflection','#endingRestart','#audioModal label','#audioModal output'])for(const el of d.querySelectorAll(selector))textFits(el,label+' '+selector);
  const canvas=d.querySelector('#gameCanvas'),cs=w.getComputedStyle(canvas),r=canvas.getBoundingClientRect();
  assert(cs.imageRendering==='pixelated'||cs.imageRendering==='crisp-edges','픽셀 보간 설정 누락');
  assert(cs.objectFit==='contain'||Math.abs(r.width/r.height-canvas.width/canvas.height)<.015,'캔버스 종횡비 왜곡');
  const dialogueFont=parseFloat(w.getComputedStyle(d.querySelector('#dialogueText')).fontSize);
  if(!d.querySelector('#dialogue').hidden)assert(dialogueFont>=(w.innerWidth>=1024&&w.innerHeight>=700?17.5:15),'대사 폰트가 작음: '+dialogueFont+'px');
  for(const [parentSelector,childSelector] of [
    ['#stage','#dialogue,#titleScreen,#endingScreen,#cinematicCaption'],
    ['#dialogue','#dialogueText,#speaker,.dialogue-actions button'],
    ['#titleScreen','p,h2,button'],['#endingScreen','p,h2,button,#endingIllustration'],
    ['dialog[open]','p,h2,h3,button,.layout-page:not([hidden])']
  ])for(const parent of d.querySelectorAll(parentSelector))if(rendered(parent)){
    const pr=parent.getBoundingClientRect();
    for(const child of parent.querySelectorAll(childSelector))if(rendered(child)){
      const cr=child.getBoundingClientRect();
      assert(cr.left>=pr.left-2&&cr.top>=pr.top-2&&cr.right<=pr.right+2&&cr.bottom<=pr.bottom+2,label+' '+parentSelector+' 내부 이탈: '+(child.id||child.tagName)+' '+JSON.stringify({parent:[pr.x,pr.y,pr.width,pr.height],child:[cr.x,cr.y,cr.width,cr.height]}));
    }
  }
  const sr=d.querySelector('#stage').getBoundingClientRect();
  rows.push({label,size:currentSize.join(' × '),scroll:x+' / '+y,font:dialogueFont,stage:Math.round(sr.width)+' × '+Math.round(sr.height)});
}
function recordLayoutError(label,error){
  const entry={label,size:currentSize.join(' × '),message:error.message};layoutErrors.push(entry);
  document.documentElement.dataset.layoutErrors=String(layoutErrors.length);
  summary.textContent='검증 계속 중 · 화면 오류 '+layoutErrors.length+'건';summary.className='fail';
  log('FAIL · 화면 '+entry.size+' / '+label+' / '+error.message);
}
function inspectAndCollect(label){
  try{inspectLayout(label);return true;}catch(error){recordLayoutError(label,error);return false;}
}
async function layouts(label){
  const before=layoutErrors.length;
  for(const size of sizes){await resize(size);inspectAndCollect(label);}
  if(layoutErrors.length===before)log('PASS · '+label+' / 모든 해상도 경계·글자·비율');
  else log('FAIL · '+label+' / 화면 오류 '+(layoutErrors.length-before)+'건 기록, 다음 장면 검증 계속');
}
function renderMetrics(){metrics.replaceChildren();for(const r of rows){const tr=document.createElement('tr');for(const value of [r.label,r.size,r.scroll,r.font+' px',r.stage]){const td=document.createElement('td');td.textContent=value;tr.append(td);}metrics.append(tr);}}
const endingImages=new Set();
const snap=()=>api.snapshot();
function diagnosticSnapshot(){
  const s=snap();return {world:s.world,phase:s.game.phase,ready:s.ready,busy:s.busy,paused:s.paused,keys:s.keys,player:s.player,walk:s.walk,dialogue:s.dialogue,modals:[...d.querySelectorAll('dialog[open]')].map(el=>el.id),visibility:d.visibilityState,hasFocus:d.hasFocus(),activeElement:d.activeElement?.id||d.activeElement?.tagName,lastTime:s.lastTime,footsteps:s.audio?.footsteps,audioState:s.audio?.state};
}
const observed=()=>snap().observed||snap().game.observed||[];
const score=()=>{const s=snap().game;return JSON.stringify({suspicion:s.suspicion,trust:s.trust,found:s.found});};
const audio=()=>snap().audio;
function key(code,type='keydown'){d.querySelector('#gameCanvas').dispatchEvent(new w.KeyboardEvent(type,{code,bubbles:true}));}
function closeModal(id){const m=d.getElementById(id);if(m?.open){key('Escape');assert(!m.open,id+' 닫기 실패');}}
function confirmInfo(){const modal=d.querySelector('#infoModal');assert(modal.open,'확인할 안내창 없음');const button=d.querySelector('#infoActions button');assert(button,'안내창 확인 버튼 없음');button.click();}
function advanceAll(){for(let i=0;i<250;i++){const s=snap();if(!s.dialogue||s.busy)return;if(s.dialogue.index===s.dialogue.total-1&&s.dialogue.choices.length)return;api.advance();}throw Error('대사 진행 반복');}
function advanceToLast(){for(let i=0;i<250;i++){const s=snap();assert(s.dialogue&&!s.busy,'읽고 있는 대사 없음');if(s.dialogue.index===s.dialogue.total-1)return;api.advance();}throw Error('마지막 대사 접근 실패');}
async function progressTo(predicate,label,{allowInfo=false}={}){
  const start=performance.now();
  while(performance.now()-start<30000){
    const s=snap();if(predicate(s))return;
    if(s.busy){await wait(40);continue;}
    if(s.dialogue){assert(!(s.dialogue.index===s.dialogue.total-1&&s.dialogue.choices.length),label+' 중 예상하지 않은 선택지');advanceAll();continue;}
    if(d.querySelector('#infoModal').open){assert(allowInfo,label+' 중 예상하지 않은 안내창');confirmInfo();continue;}
    await wait(40);
  }
  throw Error(label+' 시간 초과 / '+JSON.stringify({phase:snap().game.phase,busy:snap().busy,dialogue:snap().dialogue}));
}
function normalizeText(text){return text.replace(/\s+/gu,'');}
async function paginatedLayouts(containerId,label,originalTexts=[]){
  const errorsBefore=layoutErrors.length;
  for(const size of sizes){
    await resize(size);
    const container=d.getElementById(containerId),nav=d.querySelector('.layout-page-navigation[data-for="'+containerId+'"]');
    const previous=nav?.querySelector('button:first-child'),next=nav?.querySelector('button:last-child');
    let safety=0;while(previous&&!previous.disabled&&safety++<100){previous.click();await resize(size);}assert(safety<100,label+' 이전 페이지 반복');
    const expectedPages=container.querySelectorAll('.layout-page').length||1,visited=[];
    for(let page=0;page<expectedPages;page++){
      inspectAndCollect(label+' '+(page+1)+'/'+expectedPages);
      const active=[...container.querySelectorAll('.layout-page')].filter(rendered);
      assert(active.length===1,label+' 활성 페이지 개수 오류');
      const state=w.SAINT_LAYOUT.snapshot().modals.find(m=>m.id===containerId);
      if(state&&active[0].getBoundingClientRect().height>state.budget+2)recordLayoutError(label,Error('페이지 높이 예산 초과: '+active[0].getBoundingClientRect().height+' / '+state.budget));
      visited.push(active[0].textContent);
      if(page+1<expectedPages){assert(next&&!next.disabled,label+' 다음 페이지 접근 불가');next.click();await resize(size);}
    }
    for(const text of originalTexts)assert(normalizeText(visited.join('')).includes(normalizeText(text)),label+' 원문 누락: '+text.slice(0,25));
    if(next)assert(next.disabled,label+' 마지막 페이지 버튼 상태 오류');
  }
  log((layoutErrors.length===errorsBefore?'PASS':'FAIL')+' · '+label+' / 모든 페이지 접근·원문 보존');
}
async function storyDoorLock(mapId,exitId,phase){
  const def=w.SAINT_PORTALS.entries(mapId).find(p=>p.id===exitId),id=mapId+':'+exitId;
  assert(def?.approach,'진행 제한 문 좌표 없음 '+id);assert(api.go(mapId,def.approach),'진행 제한 문 접근 실패 '+id);await wait(400);
  for(let i=0;i<85&&!snap().portals.blocked.includes(id);i++){api.testMove(def.inward[0]*4,def.inward[1]*4);assert(snap().world===mapId,'스토리 진행 전 문이 열림 '+id);}
  assert(snap().portals.blocked.includes(id),'진행 제한 문 접촉 누락 '+id);assert(snap().game.phase===phase,'자동 입장으로 스토리 단계 변경 '+id);
  log('PASS · '+phase+' 단계 '+id+' 잠금 유지');
}
async function intro(choice,check=false){
  api.reset();assert(observed().length===0,'새 게임에 관찰 기록 잔존');if(check)await layouts('타이틀');api.start();if(check)await layouts('개선된 미사 대화');
  const cast=snap().cast.join(',');assert(new Set(snap().cast).size===6,'주민 외형 중복');
  await progressTo(s=>s.game.phase==='seven'&&!s.busy,'미사·개인 대화 완료');
  if(check)await paginatedLayouts('infoContent','세븐 만남 안내');confirmInfo();
  if(check)await storyDoorLock('entrance','square_out','seven');
  api.go('entrance',{x:501,y:290});api.interact();assert(snap().dialogue,'세븐 상호작용 실패');if(check)await layouts('세븐 자기결정 대화');advanceAll();
  await until(()=>snap().game.phase==='gossip'&&!snap().busy,'세븐 퇴장 완료');advanceAll();confirmInfo();
  if(check)await storyDoorLock('square','house_out','gossip');
  api.go('square',{x:455,y:365});assert(snap().cast.join(',')===cast,'주민 외형 변동');api.interact();if(check)await layouts('서로 다른 주민 입장');advanceAll();
  assert(snap().game.phase==='elder','소문 단계 유지');api.go('square',{x:925,y:720});api.interact();advanceAll();assert(snap().dialogue.choices.length===2,'기존 두 선택지 보존');
  if(check)await layouts('주민 대답 선택지');api.choose(choice);advanceAll();confirmInfo();
  assert(snap().game.phase==='investigation','조사 단계 진입');assert(snap().game.suspicion===0&&snap().game.trust===0,'조사 초기 상태');
}
function readClue(id){const before=score();api.collect(id);assert(d.querySelector('#infoModal').open,'단서 읽기창 없음 '+id);assert(score()===before,'읽기만으로 판단 반영 '+id);assert(d.querySelectorAll('#infoActions button').length===1,'단서 확인 버튼 개수 변경');}
function acceptClue(id){readClue(id);confirmInfo();}
function deferClue(id,keyId=id){readClue(id);assert(observed().includes(keyId),'관찰 기록 누락 '+keyId);const before=score();closeModal('infoModal');assert(score()===before,'보류 후 점수 변경 '+keyId);}
async function journalReopen(id,{accept=false}={}){
  d.querySelector('#journalButton').click();assert(d.querySelector('#journalModal').open,'관찰 기록 열기 실패');
  await resize(currentSize);
  const entry=d.querySelector('#journalEntries [data-clue-id="'+id+'"]');assert(entry,'관찰 단서 다시 보기 버튼 없음 '+id);
  const page=entry.closest('.layout-page');if(page?.hidden){const nav=d.querySelector('.layout-page-navigation[data-for="journalEntries"]'),previous=nav.querySelector('button:first-child'),next=nav.querySelector('button:last-child');while(!previous.disabled)previous.click();let i=0;while(page.hidden&&i++<100&&!next.disabled)next.click();assert(!page.hidden,'관찰 단서 페이지 접근 불가 '+id);}
  const before=score();entry.click();assert(d.querySelector('#infoModal').open,'기록에서 단서 열기 실패');assert(score()===before,'기록 다시 보기로 점수 변경');
  if(accept)confirmInfo();else closeModal('infoModal');closeModal('journalModal');
}
async function observationCheck(){
  api.collect('diary');assert(!observed().includes('diary')&&!snap().game.found.includes('diary'),'양피지 판단 전 조사 단계 우회');advanceAll();
  deferClue('parchment');assert(!snap().game.found.includes('parchment'),'양피지 보류 중 진행 플래그 획득');
  api.collect('diary');assert(!observed().includes('diary'),'양피지 읽기만으로 후속 조사 허용');advanceAll();
  await journalReopen('parchment',{accept:true});assert(snap().game.found.includes('parchment'),'기록 재열기 후 양피지 판단 실패');
  deferClue('diary');await resize([844,390]);await journalReopen('diary');assert(snap().game.suspicion===0,'보류한 일기 재열기로 의심 상승');
  await journalReopen('diary',{accept:true});assert(snap().game.suspicion===1,'일기 판단 반영 실패');
  const before=score();api.collect('diary');confirmInfo();assert(score()===before,'이미 판단한 단서 중복 상승');
  deferClue('bible');assert(!snap().game.found.includes('bible')&&snap().game.trust===0,'성경 내용 열람으로 자동 신뢰');
  deferClue('bible','cover');await journalReopen('cover',{accept:true});assert(snap().game.found.includes('cover')&&!snap().game.found.includes('bible')&&snap().game.trust===0,'성경에 동의하지 않은 비판적 재조사 경로 실패');
  const beforePromise=score();api.talk('elder');advanceToLast();assert(d.querySelector('#dialogueActions button').textContent===w.SAINT_NARRATIVE.labels.elderCommit,'자기 희생 약속 버튼이 시나리오의 명시적 선택 문구와 다름');key('Escape');assert(!snap().dialogue&&score()===beforePromise&&!snap().game.found.includes('elder'),'주민 강요를 읽기만 하거나 보류했는데 약속 반영');
  log('PASS · 정보/판단 분리·기록 재열기·양피지 조건·신뢰 없는 성경 재검토·자기 희생 약속 보류');
}
function faith(){api.talk('eli');api.choose(0);advanceAll();assert(snap().dialogue?.choices.length===2,'사제 판단 두 선택지 유지');api.choose(0);}
async function longTextAndModals(){
  acceptClue('restore');acceptClue('bible');acceptClue('bible');api.talk('elder');advanceAll();
